# 臨界状態テスト暫定版
# (custom_Akita e/i-stdp・ExpCond・akita_escape_lif)。
# 空間配置 + 距離依存結合 + 距離依存遅延 を組み合わせる。
# 初期重みは対数正規 (MD §10)、STDP は custom_Akita を MD §7 に整合 (e/i-stdp_beggs)。
simulation:
  N: 3600  # 面積より算出（例：(3×3mm^2)× 400 neuron/mm^2 = 3,600 neurons）
  dt: 0.1
  seed: 1
  backend: cuda       # GeNN バックエンド: cuda | cpu | auto

inputs:
  # akita_escape_lif の escape 発火(f_rest)が自発活動を供給するため外部ノイズは不要。
  GaussianNoise:
    enable: false
    mean: 0.0
    sd: 0.0

neurons:
  # E/I = 80/20
  Layer_Exc:
    type: akita_escape_lif_physical
    mode: excitatory
    polarity: excitatory
    num: 2880
  Layer_Inh:
    type: akita_escape_lif_physical
    mode: inhibitory
    polarity: inhibitory
    num: 720

synapses:
  from_Exc:
    source: [Layer_Exc]
    plasticity:
      type: custom_Akita
      mode: e-stdp_physical
      pairing: trace
    synapse:
      type: ExpCond
      mode: excitatory
  from_Inh:
    source: [Layer_Inh]
    plasticity:
      type: custom_Akita
      mode: i-stdp_physical
      pairing: trace
    synapse:
      type: ExpCond
      mode: inhibitory

network:
  area: modular_4_3mm       # 2×2 モジュール(円)を十字ブリッジで連結。面積 8.997 mm^2
  space: area_uniform       # エリア内に一様ランダム配置。module 軸が自動で立つ
  connection: axon_growth   # 軸索伸長アルゴリズム
  weight: lognormal_broad   # 対数正規初期重み (all zeroでもいい)
  delay: distance_based     # 距離依存遅延 delay(d)=d/500 + 1.0ms

# 軸索 参考文献：https://www.frontiersin.org/journals/neuroscience/articles/10.3389/fnins.2025.1570783/full
# モジュール構造は space クラスではなく **エリアの形** が決める (configs/components/areas.yaml)。
# 軸索はエリアの外へ出ないので、モジュール間の結合はブリッジを通ったものだけになる。