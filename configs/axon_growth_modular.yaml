# 軸索伸長アルゴリズムを「複合エリア」(モジュール構造) の上で走らせる版。
# エリアは 4 つの円と十字の矩形 2 枚。**円と矩形の間には 40 um の隙間があるので実際には
# 5 つの独立した連結成分**で、軸索も樹状突起もこの空隙を越えられない (areas.yaml 参照)。
# したがって 4 モジュールは互いに完全に独立したサブネットワークになる。
# part の index が module 軸になる。
simulation:
  N: 891  # 面積より算出 (2.227 mm^2 x 400 neurons/mm^2)
  dt: 0.1
  seed: 1
  backend: cuda       # GeNN バックエンド: cuda | cpu | auto

inputs:
  # akita_escape_lif の escape 発火が自発活動を供給するため外部ノイズは不要。
  GaussianNoise:
    enable: false
    mean: 0.0
    sd: 0.0

neurons:
  # 面積 2.227 mm^2 x 400 neurons/mm^2 = 891、E/I = 80/20
  Layer_Exc:
    type: akita_escape_lif_physical
    mode: excitatory
    polarity: excitatory
    num: 713
  Layer_Inh:
    type: akita_escape_lif_physical
    mode: inhibitory
    polarity: inhibitory
    num: 178

synapses:
  from_Exc:
    source: [Layer_Exc]
    plasticity:
      type: custom_Akita
      mode: e-stdp_physical
      pairing: trace
    synapse:
      type: ExpCond
      mode: excitatory
  from_Inh:
    source: [Layer_Inh]
    plasticity:
      type: custom_Akita
      mode: i-stdp_physical
      pairing: trace
    synapse:
      type: ExpCond
      mode: inhibitory

network:
  area: modular_4          # 4 モジュール (円) + 十字。互いに非連結。module 軸が自動で立つ
  space: area_uniform       # エリア内に一様ランダム配置
  connection: axon_growth   # 軸索伸長アルゴリズム
  weight: lognormal_broad   # 対数正規初期重み
  delay: distance_based     # 距離依存遅延 delay(d)=d/500 + 1.0ms
