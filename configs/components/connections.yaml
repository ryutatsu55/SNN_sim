constant_prob:
  p: 0.5
  allow_self_connections: false

# 全結合 (p=1.0) では **密生成のほうが軽い**ので、メイン config に
#   network:
#     sparse: off
# を明示すること。疎 (COO) は 1 シナプスあたり 16 バイト (row/col int32 + weight/delay
# float32) を持つので nnz=N² だと 16N² になり、密の 9N² (mask int8 + weight/delay float32)
# を上回る。`auto` は「疎対応なら疎」を選ぶだけで結合の密度を見ないため、判断はユーザー側。
constant_prob_full:
  p: 1.0
  allow_self_connections: false

# 上記 constant_prob_full と同じく、全結合なので network.sparse: off を推奨。
constant_prob_full_autapse:
  p: 1.0
  allow_self_connections: true

constant_prob_sparse:
  p: 0.2
  allow_self_connections: false

distance_based:
  sigma: 10   # [um]
  max_prob: 0.8

prob_based_block:
  num_modules: 4
  within_module_connection_prob: 0.1
  between_module_connection_prob: 0.01
  allow_self_connections: true

optional_connect:
  src_ID: 1
  tgt_ID: 0

"C.elegans":
  # C_elegansConnection は synapse_mask.csv(chem∪elec, 81x81)を読む。パラメータ不要。
  source: synapse_mask.csv

# Beggs & Plenz (2003) 再現用・種別別ガウス結合 P=p0*exp(-d^2/2σ^2)
# (docs/refs/SNN_PA~1.MD §3)。gaussian_distance_type クラスが送信×受信の 4 ブロックに
# それぞれの (sigma, p0) を適用する。σ,p0 は MD の各種別レンジの代表中央値。
beggs_plenz:
  # E→E: ラット皮質L2/3水平軸索拡がり ~500um (Hellwig 2000, Biol Cybern); IED=200um から σ≈IED〜1.5×IED
  sigma_ee: 300.0   # [um]
  p0_ee: 0.20
  # E→I: 抑制性ニューロンへはより局所的に集中 (Fino & Yuste 2011, Neuron)
  sigma_ei: 200.0   # [um]
  p0_ei: 0.30
  # I→E: 皮質抑制は空間的に局所 (Fino & Yuste 2011, Neuron)
  sigma_ie: 175.0   # [um]
  p0_ie: 0.25
  # I→I: 最も局所 (Fino & Yuste 2011, Neuron)
  sigma_ii: 125.0   # [um]
  p0_ii: 0.20
  allow_self_connections: false   # オートシナプス禁止 (MD §8; Bekkers & Stevens 1991, PNAS)

# 軸索伸長アルゴリズムによる結合生成。
# Sumi et al. (2025) Front. Neurosci. 19:1570783 §2.8 / Orlandi et al. (2013)。
# 軸索は network.area の内部から出ない (境界に当たると壁沿いに偏向する)。
axon_growth:
  mean_axon_length: 1100.0   # um  軸索全長 (Rayleigh 分布) の平均
  segment_length: 100.0      # um  1 セグメントの長さ
  angle_sigma: 0.1           # rad 1 ステップあたりの方向の揺らぎ (= 5.73 deg)
  dendrite_radius: 150.0     # um  樹状突起円の半径 (結合の受容範囲)
  connection_prob: 0.2       #     樹状突起円への**侵入 1 回**あたりの結合確率 (論文の規則。
                             #     セグメント単位ではないので segment_length に依存しない)
  boundary: deflect          #     境界処理: deflect (壁沿いに滑る) | reflect | stop
  allow_self_connections: false

# axon_growth の segment_length を 1/10 に細かくした版。狭い通路 (ブリッジ) を軸索に
# 通させたいときに使う。100 um ステップだと、1 本の弦が幅 20 um の通路に収まる角度が
# +-11 度 (幅 4.5 um なら +-2.6 度) しかなく、通路が幾何として存在しないのと同じになる。
#
# ============================================================================
# **segment_length を変えるときは angle_sigma を必ず再計算すること。**
#
#     angle_sigma = 0.1 * sqrt(segment_length / 100)
#
# 持続長 Lp = 2 * segment_length / angle_sigma^2 = 20 mm を保つための式。Lp は
# 「軸索がどれだけ進むと元の向きを忘れるか」で、Orlandi et al. (2013) の言う
# "quasi-straight" な軌跡の実体。sigma を据え置いて Δs だけ下げると Lp が比例して
# 落ち (Δs=10 なら 2 mm = 軸索長と同程度)、別のモデルになる。
# 早見: Δs=50 -> 0.0707107,  25 -> 0.05,  10 -> 0.0316228,  5 -> 0.0223607
#
# mean_axon_length / dendrite_radius / connection_prob は**写すだけ**(Δs 非依存)。
# 導出・検証手順・他に何が動くか (弧長の切り捨て、通路の通過率、コスト) は
#   docs/technical/axon_growth_segment_length.md
# にまとめてある。新しい Δs のプロファイルを足すときはそちらを読むこと。
# ============================================================================
axon_growth_fine:
  mean_axon_length: 1100.0   # um  軸索全長 (Rayleigh 分布) の平均
  segment_length: 10.0       # um  1 セグメントの長さ
  angle_sigma: 0.0316227766  # rad = 0.1 / sqrt(10)。Lp = 2*10/sigma^2 = 20 mm
  dendrite_radius: 150.0     # um  樹状突起円の半径 (結合の受容範囲)
  connection_prob: 0.2       #     樹状突起円への侵入 1 回あたりの結合確率
  boundary: deflect          #     境界処理: deflect (壁沿いに滑る) | reflect | stop
  allow_self_connections: false
