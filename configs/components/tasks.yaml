pqn_test:
  input: 0.00         # [nA]
  input_type: "step"  # (step or continuous)
  duration: 10000.0    # [ms]
  graph_name: "PQN_V_test"

smoke:
  # 記録プロトコルのスモーク用 (スクリプト・解析・可視化の疎通確認)。
  # **どの実験の持ち物でもない。** 実験固有の記録プロトコルは
  # `scripts/<実験>/task.yaml` にある (develop / akita_soc / lesion)。
  # ここに残っているのは、config だけを検証するテストが「何か 1 つ解決できる
  # プロファイル」を必要とするため。
  duration: 120000.0          # 2 min [ms]
  record_hours: [0, 0.0166667]  # 0 s と 60 s (= 1/60 h)
  record_window_ms: 30000.0   # 30 s
  record_buffer_ms: 5000.0

lif_test:
  duration: 10000.0
  input: -49.0
  devide: 5
  tgt_ID: 1

stdp_test:
  duration: 150.0
  input: -49.0    # lifの膜電位を想定
  dt_max: 100
  dt_min: -100
  ddt: 2

spatial_recognition:
  duration: 10000.0
  input:
    type: "spatial"
    strength: 0.5
    duration_stim: 0.1
    input_nodes: 30
  output:
    teaching_duration: 2.5
    readout_nodes: 60
  experiment:
    n_train: 20
    n_test: 10

voice_recognition:
  name: "voice_recognition"
  input:
    type: "cochleagram"
    input_dt: 0.008        # 旧 INPUT_DT_COCH
    input_nodes: 17
  output:
    teaching_duration: 2.5
    readout_nodes: 60
  experiment:
    duration_interval: 10.0 # 旧 DURATION_INTERVAL_COCH
    n_train: 14  
    n_test: 6

spatio_temporal:
  name: "spatio_temporal"
  input:
    type: "spatio_temp"
    strength: 0.5
    duration_stim: 0.1
    input_dt: 0.01         # 旧 SPATIO_TEMP_DT
    input_nodes: 30
  output:
    teaching_duration: 2.5
    readout_nodes: 60
  experiment:
    duration_interval: 10.0
    n_train: 20
    n_test: 10

real_time_control:
  name: "real_time_control"
  input:
    type: "real_time"
    strength: 0.5
    duration_stim: 0.1
    input_dt: 0.01   
  output:
    teaching_duration: 2.5
    readout_nodes: 60
  experiment:
    duration_interval: 10.0
    n_train: 20
    n_test: 10  
  realtime:
    io_interval: 0.005 # 5ms周期
