simulation:
  N: 81
  dt: 0.1
  seed: 1
  backend: cuda       # GeNN バックエンド: cuda | cpu | auto

inputs:
  GaussianNoise:
    enable: false
    mean: 0.0
    sd: 0.0

# C. elegans コネクトーム(81 ニューロン)。空間/結合/重みは実データ、遅延は距離ベース。
# E/I(population)は layout.assignment=random で層と無相関に散布する。
# 層(layer 軸)は C_elegansSpace.describe_axes() が CSV の Layer 列から宣言する。
layout:
  assignment: random

neurons:
  Layer_Exc:
    type: akita_escape_lif
    mode: excitatory
    polarity: excitatory
    num: 65
  Layer_Inh:
    type: akita_escape_lif
    mode: inhibitory
    polarity: inhibitory
    num: 16

synapses:
  from_Exc:
    source: [Layer_Exc]
    plasticity:
      type: custom_Akita
      mode: e-stdp
      pairing: trace
    synapse:
      type: ExpCond
      mode: excitatory
  from_Inh:
    source: [Layer_Inh]
    plasticity:
      type: custom_Akita
      mode: i-stdp
      pairing: trace
    synapse:
      type: ExpCond
      mode: inhibitory

network:
  area: no_space            # 領域の制約なし (確率ベースの結合なので領域を参照しない)
  space: "C.elegans"        # ordered_coords.csv の実3D座標 + Layer(IN1..IN4)
  connection: "C.elegans"   # synapse_mask.csv (chem∪elec)
  weight: "C.elegans"       # weight_matrix_chem/elec.csv (elec 上書き, [min,max] クリップ→max正規化)
  delay: distance_based     # 実座標距離 / velocity + min_delay
