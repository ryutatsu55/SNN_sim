# golden テスト (`test/test_network_golden.py`) 用のネットワーク設定。
#
# 軸索伸長 (axon_growth) で結合し、領域・配置・重み・遅延のすべてが乱数を引く構成。
# `configs/axon_growth.yaml` を N=500 に縮めたもの。**実験の config を借りない** ——
# 借りると、実験の条件を変えるたびに golden が落ちる。
#
# ここを書き換えると期待値が変わる。変えたら test_network_golden.py の EXPECTED も
# 更新すること (既存 run は解決済みの config.yaml を持つので、ここを変えても影響しない)。

simulation:
  N: 500
  dt: 0.1
  seed: 7
  backend: cpu

inputs:
  GaussianNoise:
    enable: false
    mean: 0.0
    sd: 0.0

neurons:
  Layer_Exc:
    type: akita_escape_lif_physical
    mode: excitatory
    polarity: excitatory
    num: 400
  Layer_Inh:
    type: akita_escape_lif_physical
    mode: inhibitory
    polarity: inhibitory
    num: 100

synapses:
  from_Exc:
    source: [Layer_Exc]
    plasticity:
      type: custom_Akita
      mode: e-stdp_physical
      pairing: trace
    synapse:
      type: ExpCond
      mode: excitatory
  from_Inh:
    source: [Layer_Inh]
    plasticity:
      type: custom_Akita
      mode: i-stdp_physical
      pairing: trace
    synapse:
      type: ExpCond
      mode: inhibitory

network:
  area: disk
  space: area_uniform
  connection: axon_growth
  weight: lognormal_broad
  delay: distance_based
